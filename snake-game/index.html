<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>貪食蛇 Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <!-- layout expects specific IDs present: score/high/speed/leaderboard -->
</head>
<body>
  <div class="app">
    <header class="head">
      <h1>貪食蛇 Snake</h1>
      <nav class="nav"><a href="../arcade/index.html">← 回 Arcade</a></nav>
      <div class="stats">
        <div>得分 <span id="score">0</span></div>
        <div>最高 <span id="high">0</span></div>
        <div>速度 <span id="speed">1x</span></div>
      </div>
    </header>

    <main class="main">
      <!-- Board -->
      <div class="playzone">
        <canvas id="board" width="480" height="480" aria-label="Game board" tabindex="0"></canvas>
      </div>

      <!-- Touch controls: 下方左右兩側，上/左 與 下/右 -->
      <div class="touch two-columns" aria-label="Touch controls">
        <div class="col left">
          <button data-dir="up" aria-label="Up">上</button>
          <button data-dir="left" aria-label="Left">左</button>
        </div>
        <div class="col right">
          <button data-dir="down" aria-label="Down">下</button>
          <button data-dir="right" aria-label="Right">右</button>
        </div>
      </div>

      <!-- Controls (名稱、模式、開始/暫停/重來) -->
      <div class="controls">
        <label class="namewrap">名稱
          <input id="playerName" class="name" placeholder="你的名字" maxlength="12" />
        </label>
        <label class="mode" for="modeSelect">模式
          <select id="modeSelect">
            <option value="normal" selected>一般</option>
            <option value="versus">對戰</option>
            <option value="infinite">無限</option>
          </select>
        </label>
        <button id="startBtn" class="primary">開始</button>
        <button id="pauseBtn">暫停</button>
        <button id="restartBtn">重新開始</button>
      </div>

      <!-- Leaderboard -->
      <aside id="leaderboard" class="leaderboard" aria-label="排行榜"></aside>

      <!-- Hint -->
      <p class="hint">操作：方向鍵 / WASD，空白鍵暫停，R 重新開始。請先輸入名稱再按「開始」。</p>
    </main>

    <footer class="foot">
      <small>Made by otakushimm - Local-only, no tracking</small>
    </footer>
  </div>

  <script src="main.js"></script>
  </body>
  </html>
